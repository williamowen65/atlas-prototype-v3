<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graph Nodes · Atlas</title>
  <link id="app-styles" rel="stylesheet" href="./styles.css" />
  <link id="page-styles" rel="stylesheet" href="./page-layout.css" />
  <script>
    const previewVersion = Date.now();
    document.querySelector("#app-styles").href = `./styles.css?preview=${previewVersion}`;
    document.querySelector("#page-styles").href = `./page-layout.css?preview=${previewVersion}`;
  </script>
</head>
<body>
  <main class="app-shell">
    <nav class="app-nav" aria-label="Graph navigation">
      <a class="app-nav-link active" href="./index.html" aria-current="page">Nodes</a>
      <a class="app-nav-link" href="./create.html">Create Node</a>
    </nav>

    <header class="page-header compact-page-header">
      <div>
        <p class="eyebrow">Atlas Prototype V3 · PTT-58</p>
        <h1>Graph Nodes</h1>
        <p class="lede">Inspect and manage Graph Nodes stored locally in this browser.</p>
      </div>
      <div class="storage-card" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <div>
          <strong id="storage-status">Connecting to IndexedDB…</strong>
          <span id="storage-detail">Local browser persistence</span>
        </div>
      </div>
    </header>

    <section class="workspace nodes-workspace">
      <section class="panel data-panel">
        <div class="panel-heading data-heading">
          <div>
            <p class="eyebrow">Stored locally</p>
            <h2>Nodes <span id="node-count" class="count-badge">0</span></h2>
          </div>
          <div class="toolbar">
            <a class="button button-primary button-link" href="./create.html">Create Node</a>
            <button id="load-fixtures" class="button button-secondary" type="button">Load sample data</button>
            <button id="toggle-raw" class="button button-secondary" type="button" aria-expanded="false">Show raw data</button>
            <button id="clear-all" class="button button-danger" type="button">Clear all</button>
          </div>
        </div>

        <div id="message" class="message" role="status" aria-live="polite" hidden></div>
        <div id="node-list" class="node-list"></div>

        <section id="raw-data-panel" class="raw-data-panel" hidden>
          <div class="raw-heading">
            <h3>IndexedDB data</h3>
            <span>Current Node records as JSON</span>
          </div>
          <pre id="raw-data">[]</pre>
        </section>
      </section>
    </section>
  </main>

  <script type="module">
    import(`./src/app/main.js?preview=${Date.now()}`);
  </script>
</body>
</html>
