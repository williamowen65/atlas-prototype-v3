<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graph Post · Atlas</title>
  <link id="app-styles" rel="stylesheet" href="./styles.css" />
  <link id="page-styles" rel="stylesheet" href="./page-layout.css" />
  <link id="hierarchy-styles" rel="stylesheet" href="./hierarchy.css" />
  <link id="site-header-styles" rel="stylesheet" href="./site-header.css" />
  <script>
    const previewVersion = Date.now();
    document.querySelector("#app-styles").href = `./styles.css?preview=${previewVersion}`;
    document.querySelector("#page-styles").href = `./page-layout.css?preview=${previewVersion}`;
    document.querySelector("#hierarchy-styles").href = `./hierarchy.css?preview=${previewVersion}`;
    document.querySelector("#site-header-styles").href = `./site-header.css?preview=${previewVersion}`;
  </script>
</head>
<body>
  <main class="app-shell post-app-shell">
    <header class="site-toolbar-shell">
      <a class="site-toolbar-title" href="./index.html" aria-label="Atlas home">
        <strong>Atlas hierarchy</strong>
        <span>Public think tank</span>
      </a>
      <nav class="app-nav" aria-label="Atlas navigation">
        <a class="app-nav-link" href="./index.html">Home</a>
        <a class="app-nav-link" href="./feed.html">Feed</a>
        <a class="app-nav-link" href="./create.html">Create Node</a>
      </nav>
    </header>

    <div class="storage-card page-storage-state" aria-live="polite" hidden>
      <span class="status-dot" aria-hidden="true"></span>
      <div>
        <strong id="storage-status">Local</strong>
        <span id="storage-detail">Connecting…</span>
      </div>
    </div>

    <section class="workspace post-workspace">
      <div id="post-message" class="message" role="status" aria-live="polite" hidden></div>
      <div id="post-view"></div>
    </section>
  </main>

  <script src="https://d3js.org/d3.v6.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-weighted-voronoi@1.1.3/build/d3-weighted-voronoi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-voronoi-map@2.1.1/build/d3-voronoi-map.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-voronoi-treemap@1.1.2/build/d3-voronoi-treemap.min.js"></script>
  <script type="module">
    import(`./src/app/post.js?preview=${Date.now()}`);
  </script>
</body>
</html>
