name: Preview GitHub Pages

on:
  push:
    branches:
      - preview
      - 'PTT-*'
  workflow_dispatch:

concurrency:
  group: preview-pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  follow-preview:
    name: Keep preview following the active feature branch
    if: github.event_name == 'push' && github.ref_name != 'preview'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Advance preview and request a preview deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const beforeSha = context.payload.before;
            const newSha = context.sha;

            const previewRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/preview'
            });

            const previewSha = previewRef.data.object.sha;

            if (previewSha !== beforeSha) {
              core.notice(
                `preview is not following ${context.ref}; leaving preview unchanged.`
              );
              return;
            }

            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/preview',
              sha: newSha,
              force: true
            });

            core.notice(`Moved preview from ${beforeSha} to ${newSha}.`);

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'preview-pages.yml',
              ref: 'preview'
            });

            core.notice('Requested GitHub Pages deployment from the preview ref.');

  deploy-preview:
    name: Deploy preview branch to GitHub Pages
    if: github.ref_name == 'preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout preview
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
